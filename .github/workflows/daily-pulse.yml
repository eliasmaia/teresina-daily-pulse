name: Teresina Daily Pulse - Pipeline Diário

on:
  workflow_dispatch: # Disparado manualmente ou via cron-job.org (GitHub API)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar pipeline de notícias, TTS e RSS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          PODCAST_OWNER_EMAIL: ${{ vars.PODCAST_OWNER_EMAIL }}
          
        run: python main.py
      - name: Salvar episódios gerados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --staged --quiet || git commit -m "chore: publica episódio diário $(date -u +'%Y-%m-%d')"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar pasta public/ para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4