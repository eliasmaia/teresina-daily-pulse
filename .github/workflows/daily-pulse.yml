name: Teresina Daily Pulse - Daily Pipeline

on:
  workflow_dispatch: # Triggered manually or via cron-job.org (GitHub API)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt

      - name: Run news, TTS, and RSS pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          PODCAST_OWNER_EMAIL: ${{ vars.PODCAST_OWNER_EMAIL }}
        run: python main.py

      - name: Commit generated episodes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public
          git add public/
          git diff --staged --quiet || git commit -m "chore: publish daily episode $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public directory as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "public"

      - name: Wait for artifact metadata propagation
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4